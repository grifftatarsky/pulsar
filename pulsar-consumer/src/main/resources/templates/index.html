<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Stations · Consumer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #fbfbfd;
      --card: #fff;
      --text: #111;
      --muted: #6e6e73;
      --border: #e5e5ea;
      --accent: #0071e3;
    }

    * {
      box-sizing: border-box
    }
    html {
      height: 100%;
    }

    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif
    }

    header {
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      position: sticky;
      top: 0;
      height: 5%;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    main {
      padding: 32px;
      max-width: 1100px;
      margin: 0 auto;
      height: 95%;
    }

    .grid {
      display: flex;
      flex-flow: column;
      width: 100%;
      align-items: start;
      gap: 1em;
      justify-content: space-between;
      height: 100%;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
      width: 100%;
    }

    .card:first-child {
      flex-grow: 1;
    }

    .title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600
    }

    ul.counts {
      list-style: none;
      padding: 0;
      margin: 12px 0 0
    }

    ul.counts li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-top: 1px dashed var(--border)
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px
    }
  </style>
</head>
<body>
<header><h1 th:text="|Consumer Microservice ${iteration ?: 'Not Provided'}|"></h1></header>
<main>
  <div class="grid">
    <div class="card">
      <h2 class="title">Current Counts</h2>
      <ul class="counts">
        <li><span>Type A</span><strong id="countA"
                                       th:text="${counts.get(T(com.gpt.pulsarconsumer.domain.StationType).A)}">0</strong>
        </li>
        <li><span>Type B</span><strong id="countB"
                                       th:text="${counts.get(T(com.gpt.pulsarconsumer.domain.StationType).B)}">0</strong>
        </li>
        <li><span>Type C</span><strong id="countC"
                                       th:text="${counts.get(T(com.gpt.pulsarconsumer.domain.StationType).C)}">0</strong>
        </li>
      </ul>
      <div class="muted">Bootstraps from compacted changelog, then applies live updates.</div>
    </div>
    <div class="card">
      <h2 class="title">Stations by Type</h2>
      <canvas id="pie" width="600" height="360"></canvas>
      <div class="muted">Live updates via WebSocket.</div>
    </div>
  </div>
</main>

<script>
  const ctx = document.getElementById('pie').getContext('2d');
  const ds = {
    labels: ['A', 'B', 'C'], datasets: [{
      data: [Number(document.getElementById('countA').textContent)
      || 0, Number(document.getElementById('countB').textContent)
      || 0, Number(document.getElementById('countC').textContent) || 0],
      backgroundColor: ['#0071e3', '#34c759', '#ff3b30']
    }]
  };
  const chart = new Chart(ctx, {type: 'pie', data: ds, options: {plugins: {legend: {position: 'bottom'}}}});

  function wsUrl(path) {
    const l = location;
    return (l.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + l.host + path;
  }

  const socket = new WebSocket(wsUrl('/ws/metrics'));
  socket.onmessage = e => {
    try {
      const j = JSON.parse(e.data);
      const a = j.A || 0, b = j.B || 0, c = j.C || 0;
      document.getElementById('countA').textContent = a;
      document.getElementById('countB').textContent = b;
      document.getElementById('countC').textContent = c;
      chart.data.datasets[0].data = [a, b, c];
      chart.update();
    } catch (_) {
    }
  };
</script>
</body>
</html>
