version: "3.9"

services:
  postgres-rds:
    image: postgres:latest
    container_name: postgres_rds
    restart: unless-stopped
    environment:
      POSTGRES_USER: rdsroot
      POSTGRES_PASSWORD: rdsroot
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_rds_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdsroot -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pulsar:
    image: apachepulsar/pulsar:3.2.2
    container_name: pulsar_single
    command: bin/pulsar standalone
    ports:
      - "6650:6650"   # binary
      - "8080:8080"   # admin http
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin clusters list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  pulsar-init:
    image: apachepulsar/pulsar:3.2.2
    container_name: pulsar_init
    depends_on:
      pulsar:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # Create a compacted changelog topic for stations and an optional events topic.
    command: >
      "bin/pulsar-admin topics create persistent://public/default/stations.changelog || true;
       bin/pulsar-admin topics create persistent://public/default/stations.events || true"
    restart: "no"

  pulsar-express:
    image: bbonnin/pulsar-express:latest
    container_name: pulsar_express
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      # Pulsar admin HTTP URL reachable from this container
      PE_CONNECTION_URL: http://pulsar:8080
      # Optional: name it in the UI
      PE_CONNECTION_NAME: local-pulsar
      # If you enable tokens in Pulsar later:
      # PE_CONNECTION_TOKEN: "<your_jwt_token>"
    ports:
      - "3000:3000"  # UI
    restart: unless-stopped

volumes:
  pg_rds_data:
