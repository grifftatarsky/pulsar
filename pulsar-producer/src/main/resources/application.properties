server.port=8082
# DB (producer/SoT)
spring.datasource.url=jdbc:postgresql://localhost:5433/noaa?currentSchema=station,public
spring.datasource.username=nimbus_app_station
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
# Pulsar
spring.pulsar.client.service-url=pulsar://localhost:6650
# Nimbus Pulsar
nimbus.pulsar.producer.equipment-topic=persistent://public/default/equipment.changelog
nimbus.pulsar.producer.equipment-identifier-topic=persistent://public/default/equipment_identifier.changelog
nimbus.pulsar.producer.equipment-type-identifier-topic=persistent://public/default/equipment_type_identifier.changelog
nimbus.pulsar.producer.admin-service=http://pulsar:8080
# Nimbus Pulsar Snapshot
nimbus.pulsar.producer.snapshot.batch-size=1000
nimbus.pulsar.producer.snapshot.enabled=true
nimbus.pulsar.producer.snapshot.max-parallel-types=2
# Liquibase
spring.liquibase.change-log=classpath:db/changeLog.yaml
spring.liquibase.contexts=local
logging.level.liquibase=INFO
spring.jpa.hibernate.ddl-auto=none
# Concurrency
spring.threads.virtual.enabled=true


