            initiallyDeferred: false
            onDelete: NO ACTION
            onUpdate: NO ACTION
            referencedColumnNames: identifier_id
            referencedTableName: equipment_type_identifiers
            validate: true
        - addUniqueConstraint:
            columnNames: identifier_id, equipment_id
            constraintName: uk_equipment_identifiers
            tableName: equipment_identifiers
        - createIndex:
            columns:
              - column:
                  name: entry_dttm
            indexName: idx_equipment_identifiers_entry_dttm
            tableName: equipment_identifiers