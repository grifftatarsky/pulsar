        sqlCheck:
          expectedResult: 0
          sql: "select count(*) from equipment where station_id = (select station_id from stations where call_sign = 'GOES-16')"
      changes:
        - sql:
            INSERT INTO equipment (station_id, equipment_type, location, validated, entry_dttm, update_dttm)
