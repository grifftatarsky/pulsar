databaseChangeLog:
  - changeSet:
      id: 001-create-outbox-event
      author: griff
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_event
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: NEW
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: TIMESTAMPTZ
              - column:
                  name: sent_at
                  type: TIMESTAMPTZ

        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_due
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at
              - column:
                  name: id

        - createIndex:
            tableName: outbox_event
            indexName: idx_outbox_topic_status
            columns:
              - column:
                  name: topic
              - column:
                  name: status

      rollback:
        - dropTable:
            tableName: outbox_event
            cascadeConstraints: true