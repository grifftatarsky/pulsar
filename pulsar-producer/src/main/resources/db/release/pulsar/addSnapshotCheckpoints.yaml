databaseChangeLog:
  - changeSet:
      id: create-snapshot-checkpoint
      author: gpt
      changes:
        - createTable:
            tableName: snapshot_checkpoint
            columns:
              - column:
                  name: entity_type
                  type: varchar(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: last_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false